<html lang="en">
<head>

  <style>
    :root {
      --ink: #101918;
      --ink-soft: #263332;
      --paper: #f3f0e8;
      --paper-2: #e8e3d8;
      --acid: #d7ff55;
      --white: #ffffff;
      --muted: #60706d;
      --line: rgba(16, 25, 24, 0.14);
      --shadow: 0 28px 80px rgba(4, 12, 11, 0.30);
      --radius: 30px;
    }

    * { box-sizing: border-box; }

    html { min-height: 100%; background: var(--ink); }

    body {
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 15% 15%, rgba(215, 255, 85, 0.15), transparent 28rem),
        radial-gradient(circle at 88% 84%, rgba(130, 210, 190, 0.13), transparent 26rem),
        var(--ink);
      display: grid;
      place-items: center;
      padding: max(22px, env(safe-area-inset-top)) 18px max(22px, env(safe-area-inset-bottom));
    }

    button, a { -webkit-tap-highlight-color: transparent; }

    .shell {
      width: min(100%, 440px);
      position: relative;
    }

    .ambient {
      position: absolute;
      inset: -8px;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: calc(var(--radius) + 8px);
      pointer-events: none;
    }

    .card {
      position: relative;
      overflow: hidden;
      border-radius: var(--radius);
      background: var(--paper);
      box-shadow: var(--shadow);
      border: 1px solid rgba(255,255,255,.32);
    }

    .hero {
      position: relative;
      min-height: 305px;
      padding: 28px 28px 26px;
      color: var(--paper);
      background:
        linear-gradient(150deg, rgba(255,255,255,.04), transparent 42%),
        var(--ink);
      isolation: isolate;
    }

    .hero::before {
      content: "";
      position: absolute;
      width: 230px;
      height: 230px;
      right: -92px;
      top: -62px;
      border: 1px solid rgba(215,255,85,.45);
      border-radius: 50%;
      box-shadow: 0 0 0 34px rgba(215,255,85,.045), 0 0 0 70px rgba(215,255,85,.025);
      z-index: -1;
    }

    .brand-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      letter-spacing: .16em;
      text-transform: uppercase;
      font-size: 11px;
      font-weight: 760;
    }

    .mark {
      position: relative;
      width: 27px;
      height: 27px;
      display: grid;
      place-items: center;
      color: var(--acid);
      font: 700 28px/1 Georgia, serif;
      transform: translateY(2px);
    }

    .share-top {
      width: 42px;
      height: 42px;
      border: 1px solid rgba(255,255,255,.22);
      border-radius: 50%;
      color: var(--paper);
      background: rgba(255,255,255,.06);
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: .2s ease;
    }

    .share-top:hover, .share-top:focus-visible {
      background: var(--acid);
      color: var(--ink);
      border-color: var(--acid);
      outline: none;
      transform: translateY(-1px);
    }

    .identity {
      margin-top: 76px;
    }

    .eyebrow {
      margin: 0 0 9px;
      color: var(--acid);
      font-size: 12px;
      font-weight: 750;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      max-width: 330px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(42px, 11vw, 56px);
      line-height: .94;
      font-weight: 500;
      letter-spacing: -.045em;
    }

    .tagline {
      margin: 16px 0 0;
      color: rgba(243,240,232,.69);
      font-size: 13px;
      letter-spacing: .03em;
    }

    .content {
      padding: 22px;
    }

    .primary-actions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: -45px;
      position: relative;
      z-index: 2;
    }

    .action {
      min-height: 84px;
      padding: 13px 8px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      color: var(--ink);
      background: var(--white);
      border: 1px solid rgba(16,25,24,.09);
      border-radius: 18px;
      box-shadow: 0 10px 28px rgba(8,17,15,.10);
      font-size: 11px;
      font-weight: 750;
      letter-spacing: .06em;
      text-transform: uppercase;
      transition: transform .2s ease, background .2s ease;
    }

    .action:hover, .action:focus-visible {
      transform: translateY(-3px);
      background: #faffea;
      outline: 3px solid rgba(215,255,85,.52);
      outline-offset: 2px;
    }

    .action svg { width: 23px; height: 23px; }

    .details {
      margin: 22px 0 0;
      padding: 0;
      list-style: none;
      border-top: 1px solid var(--line);
    }

    .details li {
      display: grid;
      grid-template-columns: 30px 1fr auto;
      align-items: center;
      gap: 10px;
      min-height: 57px;
      border-bottom: 1px solid var(--line);
    }

    .details svg { width: 18px; height: 18px; color: var(--muted); }

    .details a {
      min-width: 0;
      color: var(--ink-soft);
      text-decoration: none;
      font-size: 14px;
      font-weight: 610;
      overflow-wrap: anywhere;
    }

    .details a:hover { text-decoration: underline; text-underline-offset: 3px; }

    .arrow { color: #8a9693; font-size: 18px; }

    .save {
      width: 100%;
      min-height: 56px;
      margin-top: 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border-radius: 16px;
      border: 0;
      background: var(--acid);
      color: var(--ink);
      font: inherit;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: .02em;
      text-decoration: none;
      cursor: pointer;
      box-shadow: inset 0 -1px rgba(16,25,24,.18);
      transition: transform .2s ease, filter .2s ease;
    }

    .save:hover, .save:focus-visible {
      transform: translateY(-2px);
      filter: brightness(.97);
      outline: 3px solid rgba(16,25,24,.14);
      outline-offset: 2px;
    }

    .save svg { width: 20px; height: 20px; }

    .footer {
      padding: 17px 10px 4px;
      text-align: center;
      color: var(--muted);
      font-size: 10px;
      line-height: 1.45;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: max(22px, env(safe-area-inset-bottom));
      transform: translate(-50%, 18px);
      z-index: 10;
      padding: 11px 16px;
      color: var(--paper);
      background: #253330;
      border: 1px solid rgba(255,255,255,.13);
      border-radius: 999px;
      box-shadow: 0 10px 36px rgba(0,0,0,.32);
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: .22s ease;
      white-space: nowrap;
    }

    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    @media (max-width: 360px) {
      body { padding-inline: 10px; }
      .hero { padding-inline: 22px; }
      .content { padding-inline: 14px; }
      .action { font-size: 10px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; scroll-behavior: auto !important; }
    }
  </style>
</head>

  <div class="toast" id="toast" role="status" aria-live="polite">Link copied</div>

  <script>
    const shareButton = document.getElementById('shareButton');
    const toast = document.getElementById('toast');

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add('show');
      window.setTimeout(() => toast.classList.remove('show'), 2200);
    }

    shareButton.addEventListener('click', async () => {
      const shareData = {
        title: 'John Carlo Manco | Divergent Wealth',
        text: 'John Carlo Manco — Client Concierge at Divergent Wealth Pty Ltd',
        url: window.location.href
      };

      try {
        if (navigator.share) {
          await navigator.share(shareData);
        } else if (navigator.clipboard) {
          await navigator.clipboard.writeText(window.location.href);
          showToast('Card link copied');
        } else {
          window.prompt('Copy this card link:', window.location.href);
        }
      } catch (error) {
        if (error && error.name !== 'AbortError') showToast('Unable to share this card');
      }
    });
  </script>
